  <text x="48" y="72" fill="#1C2224" font-family="Inter, Geist, Arial, sans-serif" font-size="40" font-weight="500">Color combos</text>
  <text x="48" y="104" fill="#5E676A" font-family="Inter, Geist, Arial, sans-serif" font-size="16">Silver, gold, and green. The stroked scale step is the source color.</text>

  <rect x="1188" y="48" width="28" height="28" rx="6" fill="#DEDEDE" stroke="#1C2224" stroke-width="1"/>
  <text x="1224" y="67" fill="#1C2224" font-family="Inter, Geist, Arial, sans-serif" font-size="13">#DEDEDE</text>
  <rect x="1324" y="48" width="28" height="28" rx="6" fill="#EAB308"/>
  <text x="1360" y="67" fill="#1C2224" font-family="Inter, Geist, Arial, sans-serif" font-size="13">#EAB308</text>
  <rect x="1460" y="48" width="28" height="28" rx="6" fill="#065452"/>
  <text x="1496" y="67" fill="#1C2224" font-family="Inter, Geist, Arial, sans-serif" font-size="13">#065452</text>

  <g id="combo-signature">
    <rect x="48" y="140" width="374" height="400" rx="16" fill="#065452"/>
    <text x="72" y="180" fill="#8FCCC6" font-family="Inter, Geist, Arial, sans-serif" font-size="13" font-weight="500">01</text>
    <text x="72" y="220" fill="#F7F7F6" font-family="Inter, Geist, Arial, sans-serif" font-size="28" font-weight="500">Signature</text>
    <text x="72" y="252" fill="#C5E4E1" font-family="Inter, Geist, Arial, sans-serif" font-size="15">Deep green with gold.</text>
    <text x="72" y="276" fill="#8FCCC6" font-family="Inter, Geist, Arial, sans-serif" font-size="13">Highest voucher, and the brand.</text>
    <rect x="72" y="312" width="88" height="8" rx="4" fill="#EAB308"/>
    <text x="72" y="364" fill="#EAB308" font-family="Inter, Geist, Arial, sans-serif" font-size="22" font-weight="500" letter-spacing="1.5">NOE GOLD</text>
    <text x="72" y="500" fill="#E7F4F3" font-family="Inter, Geist, Arial, sans-serif" font-size="13">#065452</text>
    <text x="160" y="500" fill="#EAB308" font-family="Inter, Geist, Arial, sans-serif" font-size="13">#EAB308</text>
  </g>

  <g id="combo-paper">

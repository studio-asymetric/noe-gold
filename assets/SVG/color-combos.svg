    <text x="462" y="180" fill="#7C8486" font-family="Inter, Geist, Arial, sans-serif" font-size="13" font-weight="500">02</text>
    <text x="462" y="220" fill="#065452" font-family="Inter, Geist, Arial, sans-serif" font-size="28" font-weight="500">Paper</text>
    <text x="462" y="252" fill="#0E726B" font-family="Inter, Geist, Arial, sans-serif" font-size="15">Silver paper, green ink.</text>
    <text x="462" y="276" fill="#5E676A" font-family="Inter, Geist, Arial, sans-serif" font-size="13">Invoices and account screens.</text>
    <rect x="462" y="308" width="120" height="36" rx="8" fill="#DEDEDE"/>
    <text x="462" y="380" fill="#065452" font-family="Inter, Geist, Arial, sans-serif" font-size="20" font-weight="500">Account overview</text>
    <text x="462" y="408" fill="#0E726B" font-family="Inter, Geist, Arial, sans-serif" font-size="14">Zlat&#233; konto &#183; 6,0404 &#8364;</text>
    <text x="462" y="500" fill="#5E676A" font-family="Inter, Geist, Arial, sans-serif" font-size="13">#F7F7F6</text>
    <text x="546" y="500" fill="#5E676A" font-family="Inter, Geist, Arial, sans-serif" font-size="13">#DEDEDE</text>
    <text x="640" y="500" fill="#065452" font-family="Inter, Geist, Arial, sans-serif" font-size="13">#065452</text>
  </g>

  <g id="combo-white-gold">

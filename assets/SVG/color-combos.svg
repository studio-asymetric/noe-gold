    <text x="1242" y="180" fill="#8FCCC6" font-family="Inter, Geist, Arial, sans-serif" font-size="13" font-weight="500">04</text>
    <text x="1242" y="220" fill="#E7F4F3" font-family="Inter, Geist, Arial, sans-serif" font-size="28" font-weight="500">Living green</text>
    <text x="1242" y="252" fill="#C5E4E1" font-family="Inter, Geist, Arial, sans-serif" font-size="15">The same green, lifted.</text>
    <text x="1242" y="276" fill="#8FCCC6" font-family="Inter, Geist, Arial, sans-serif" font-size="13">So 2 000 is not as dark as 4 000.</text>
    <rect x="1242" y="320" width="72" height="28" rx="14" fill="#8FCCC6"/>
    <rect x="1322" y="320" width="72" height="28" rx="14" fill="#4EAEA6"/>
    <rect x="1402" y="320" width="72" height="28" rx="14" fill="#C5E4E1"/>
    <text x="1242" y="392" fill="#E7F4F3" font-family="Inter, Geist, Arial, sans-serif" font-size="22" font-weight="500">2 000 &#8364;</text>

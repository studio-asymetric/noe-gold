    <text x="852" y="180" fill="#9A7208" font-family="Inter, Geist, Arial, sans-serif" font-size="13" font-weight="500">03</text>
    <text x="852" y="220" fill="#3F3008" font-family="Inter, Geist, Arial, sans-serif" font-size="28" font-weight="500">White gold</text>
    <text x="852" y="252" fill="#6E520A" font-family="Inter, Geist, Arial, sans-serif" font-size="15">Silver mixed with gold.</text>
    <text x="852" y="276" fill="#9A7208" font-family="Inter, Geist, Arial, sans-serif" font-size="13">The bridge between 1 000 and 4 000.</text>
    <rect x="852" y="312" width="326" height="88" rx="12" fill="#B8963A"/>
    <text x="872" y="352" fill="#FFF6E4" font-family="Inter, Geist, Arial, sans-serif" font-size="22" font-weight="500">3 000 &#8364;</text>
    <text x="872" y="376" fill="#FFF6E4" font-family="Inter, Geist, Arial, sans-serif" font-size="13">Univerz&#225;lny voucher</text>
    <text x="852" y="500" fill="#6E520A" font-family="Inter, Geist, Arial, sans-serif" font-size="13">#B8963A</text>
    <text x="940" y="500" fill="#6E520A" font-family="Inter, Geist, Arial, sans-serif" font-size="13">#FFF6E4</text>
    <text x="1028" y="500" fill="#6E520A" font-family="Inter, Geist, Arial, sans-serif" font-size="13">#F3EEE3</text>
